name: Frontend functional tests

on:
  push:
    paths:
      - 'budgetwise-frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    paths:
      - 'budgetwise-frontend/**'
      - '.github/workflows/frontend-e2e.yml'

jobs:
  playwright:
    # Ubuntu okolje namesti Node, odvisnosti in Chromium za brezglavo izvajanje.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budgetwise-frontend
    steps:
      # Prenesi projekt in pripravi Node okolje z npm predpomnilnikom.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: budgetwise-frontend/package-lock.json
      - run: npm ci
      # Namesti Chromium in sistemske knjižnice, ki jih potrebuje Playwright.
      - run: npx playwright install --with-deps chromium
      # Neuspešen test povzroči neuspeh opravila in s tem cevovoda.
      - run: npm run test:e2e
      # Poročilo shrani tudi ob neuspehu, da je mogoče pregledati vzrok.
      - name: Shrani Playwright poročilo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # HTML poročilo in test-results sta skupaj, da povezave »View Trace« najdejo trace.zip.
          path: |
            budgetwise-frontend/playwright-report/
            budgetwise-frontend/test-results/
          retention-days: 14
