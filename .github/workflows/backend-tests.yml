name: Backend unit tests

on:
  push:
    paths:
      - 'budgetwise-backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'budgetwise-backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budgetwise-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: budgetwise-backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: budgetwise-backend/coverage/
          if-no-files-found: ignore
